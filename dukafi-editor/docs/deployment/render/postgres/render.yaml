services:
  - type: web
    name: dukafi
    runtime: image
    image:
      url: ghcr.io/corebunch/dukafi:latest
    plan: starter
    numInstances: 1
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: dukafi-db
          property: connectionString
      - key: UPLOADS_DIR
        value: /app/storage/uploads
      - key: STATIC_DIR
        value: /app/dist
      # Render auto-injects RENDER_EXTERNAL_URL at runtime; Instatic uses it as
      # the CSRF public origin, so no proxy/origin config is needed here.
      - key: INSTATIC_SECRET_KEY
        generateValue: true
    disk:
      name: uploads
      mountPath: /app/storage
      sizeGB: 10

databases:
  - name: dukafi-db
    databaseName: dukafi
    user: dukafi
    plan: basic-256mb
    diskSizeGB: 15
    ipAllowList: []
