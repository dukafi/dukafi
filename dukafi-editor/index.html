    <!--
      Brand assets live in dukafi-editor/public/, which Vite copies into the
      build output — so they land under /admin/ alongside the bundle and are
      served by Roda's `r.public`. Deliberately NOT at the server root: the
      storefront root belongs to the merchant, and `/favicon.ico` there must
      keep 404ing so a shopper never sees our mark on someone else's shop
      (storefront_spec.rb asserts exactly that).
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#9c3d1e" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dukafi</title>

        <!--
      Apply the saved admin theme BEFORE first paint.

      The theme is a token swap driven by `data-editor-theme` on the root
      element, but React only sets that after it mounts. The shell used to
      hardcode `class="dark"`, so a merchant who chose Light got a dark flash
      on every single page load — most visible in Commerce, which is where a
      merchant actually spends the day.

      Reads the same `dukafi-editor-prefs` blob the preferences store owns,
      and stays silent if it is absent or unparseable: dark is the default, and
      the shell CSS below already paints dark.
    -->
    <script>
      (function () {
        try {
          var theme = 'light';
          // The legacy key is the pre-rename spelling; the preferences store
          // migrates it on first read, but this runs before the store loads.
          var raw = localStorage.getItem('dukafi-editor-prefs')
            || localStorage.getItem('instatic-editor-prefs');
          if (raw) {
            var stored = JSON.parse(raw).theme;
            if (stored === 'light' || stored === 'dark') theme = stored;
          }
          // ALWAYS set it. globals.css still carries the dark palette on bare
          // `:root`, so an absent attribute paints dark — which is no longer
          // the default. Setting it unconditionally means the shell, the first
          // paint and React all agree.
          document.documentElement.setAttribute('data-editor-theme', theme);
        } catch (e) {
          /* corrupt or unavailable storage — fall through to the dark default */
        }
      })();
    </script>

        }
        36.3636363636% {

        }
        45.4545454545% {
          transform: translate(26px, 26px);
        }
        54.5454545455% {
          transform: translate(26px, 26px);
        }
        63.6363636364% {
          transform: translate(26px, 26px);
        }
        72.7272727273% {
          transform: translate(26px, 0px);
        }
        81.8181818182% {
          transform: translate(0px, 0px);
        }
        90.9090909091% {
          transform: translate(-26px, 0px);
        }
        100% {
          transform: translate(0px, 0px);
        }
      }

      /* The loader paints before globals.css exists, so it cannot use tokens —
         both palettes are spelled out here. Light is the base (above); dark is
         the opt-in override, matching the preference default. */
      [data-editor-theme='dark'] body,
      [data-editor-theme='dark'] .loading {
        background: #000;
        color: #ededed;
      }

      [data-editor-theme='dark'] .box:before {
