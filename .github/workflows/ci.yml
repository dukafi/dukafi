name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: dukafy
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: instatic
      - run: bun run scripts/export-schemas.ts
        working-directory: instatic
      - run: bundle exec rake test
        working-directory: dukafy
      - run: bun run build
        working-directory: instatic
